meta:
  id: level4_0_apg_state_based
  display_name: "Level 4 射擊 APG"
  level: 4
  sub_level: 0
  obs_type: state_based
  algorithm: APG
  policy_module: skrl_script.policy_APG1_state_based
  trainer_module: skrl_script.trainer_APG

model:
  state_obs_size: 18
  obs_width: 0
  obs_height: 0
  stack_size: 1
  apg:
    learning_rate: 0.0001
    checkpoint_interval: 40
    mixed_precision: false
  preprocessors:
    state:
      type: null
    value:
      type: null

train:
  timesteps: 12000
  write_interval: 1
  enable_namespaces: true
  max_episode_step: 120
  horizon: 3
  max_episode_epochs: 40
  total_epochs: 4000
  max_episode_step_evaluate: 3000
  seed: 31415926
  num_agents_each_env: 1
  num_envs_default: 4096
  reward_components: []
  reward_components_diff:
    - PlayerFaceToTargetReward1_diff
  reward_parameters:
    shoot_hit_reward: 5
    shoot_being_hit_penalty: -2
    shoot_total_approach_budget: 2
    shoot_penalty: -0.5
    max_reward_fov_degrees: 1.0
    min_reward_fov_degrees: 80.0
    max_dist: 30.0
    face_to_target_reward: 0.002
    decrease_starting_step: 100000
    max_reward_fov_degrees_final: 1.0
    decrease_fov_speed: 0.0
    episode_end_reward: 1000
  player_ids:
    - RL
    - Bot
