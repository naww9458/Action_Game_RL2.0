    integrator: implicitfast
    cone: pyramidal
    jacobian: null
    impratio: null
    tolerance: null
    ls_tolerance: null
    ccd_tolerance: null
    density: null
    viscosity: null
    wind: null
    magnetic: null
    use_mujoco_cpu: false
    enable_multiccd: false
    disable_contacts: false
    update_data_interval: 1
    save_to_mjcf: null
    ls_parallel: true
    use_mujoco_contacts: false
    include_sites: true
    skip_visual_only_geoms: true
player_configs:
- type: player
  name: Player_1
  color:
  - 200
  - 200
  - 200
  default_position:
  - 0.0
  - 0.0
  - 1.0
  default_rotation:
  - 0.0
  - 0.0
  default_velocity:
  - 0.0
  - 0.0
  - 0.0
  default_angular_velocity:
  - 0.0
  - 0.0
  - 0.0
  possess_offset: null  # 使用 control_configs 中 hull_mount_anchor 上方 3m / use anchor offset from control_configs
  abilities:
  - Articulation_body_control
  - Tool_attachment
  object:
    pattern: wheeled_armored_vehicle_basic
    type: usd
    # 針對指定 body 覆寫碰撞箱類型（body 名稱支援 * 萬用字元，值為 cylinder/box/sphere）。
    body_collision_shape_overrides:
      Wheels_*: cylinder
    object_friction: 0.6
    object_elasticity: 0.0
    file_name: wheeled_armored_vehicle_basic.usdc
    file_path_or_source: ./Action_Game_RL_Assets/assets/
    floating: null
    base_joint: null
    parent_body: -1
    only_load_enabled_rigid_bodies: false
    only_load_enabled_joints: true
    joint_drive_gains_scaling: 1
    verbose: false
    ignore_paths:
    - /root/GroundPlane
    collapse_fixed_joints: false
    enable_self_collisions: false
    apply_up_axis_from_stage: false
    root_path: /
    joint_ordering: dfs
    bodies_follow_joint_ordering: true
    skip_mesh_approximation: true
    load_authored_normals: true
    load_sites: true
    load_visual_shapes: true
    hide_collision_shapes: true
    force_show_colliders: false
    parse_mujoco_options: true
    mesh_maxhullvert: null
    schema_resolvers: null
    force_position_velocity_actuation: true
    override_root_xform: false
    use_mujoco_policy_init: true
    control_task: differential_drive
    control_policy_version: null
  controller: Human
  team_id: 1
  health: 5.0
