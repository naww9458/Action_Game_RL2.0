environment_configs:
  space_xyz:
  - 3.0
  - 3.0
  - 3.0
  interval_distance: 5.0
  gravity:
  - 0
  - 0
  - -9.81
  damping:
  - 0.1
  - 0.1
  fps_action: 50
  sub_steps: 4
  ground_shape_friction: 0.6
  solver_config:
    type: mujoco
    separate_worlds: null
