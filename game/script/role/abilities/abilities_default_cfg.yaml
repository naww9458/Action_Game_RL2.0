# ==========================================
# 角色能力與動作配置 (Abilities Configs)
# ==========================================

# 俯視角移動 (Top-down Movement)
Move_topdown_viewing_angle:
  force: 80000.0
  speed: 8.0
  cooldown: 0.0
  decay: 0.8
  key:
    keyboard:
      front: [w, up]
      left: [a, left]
      back: [s, down]
      right: [d, right]
    mouse: {}
  action_space:
    type: "box"
    dtype: "float32"
    shape: 2
    range: [-1.0, 1.0]
    description: "Multiply the output by Force for moving"

# 跳躍 (Jump)
Jump:
  force: 3000.0
  speed: 0.0
  cooldown: 1.0
  key:
    keyboard:
      action: [space]
    mouse: {}
  action_space:
    type: "discrete"
    dtype: "int64"
    shape: 1
    n: 2

# 俯視角轉向 (Top-down Rotation)
Turning_topdown_viewing_angle:
  force: 0.0
  speed: 10.0
  cooldown: 0.0
  # Bot 瞄準彈道計算用的子彈速度（與 Shoot 能力解耦，獨立可調）
  bullet_speed: 100.0
  # RL 旋轉控制增益（只在 rl_action 使用）
  torque_gain: 100.0
  max_torque: 400.0
  key:
    keyboard: {}
    mouse: {}
  action_space:
    type: "box"
    dtype: "float32"
    shape: 2
    range: [-1.0, 1.0]
    description: "Multiply the output by 180 degrees for rotation"

# 射擊 (Shoot)
# 以下 shoot 專用參數是「發射」行為的通用預設值，可被環境配置
# (level_*_default_cfg.yaml 的 abilities.<Shoot> 字典) 或
# 物件模板 (object_template/*/control_configs.yaml 的 shoot 區段) 覆寫。
Shoot:
  force: 0.0
  speed: 100.0
  cooldown: 1.0
  forward_force_n: 0.0
  recoil_force_n: 0.0
  projectile_generation_point_offset: [0.0, 0.0, 0.0]
  cooldown_s: 1.0
  projectile_mass_kg: 4.0
  projectile_radius_m: 0.055
  key:
    keyboard: {}
    mouse:
      action: [left]
  action_space:
    type: "box"
    dtype: "float32"
    shape: 1
    range: [-1.0, 1.0]

Articulation_body_control:
  force: 0.0
  speed: 0.0
  cooldown: 0.0
  key:
    keyboard: {}
    mouse: {}
  action_space:
    type: "box"
    dtype: "float32"
    shape: "auto"
    range: [-1.0, 1.0]
    description: "Low-level joint targets resolved at runtime via mjlab_components.act."

Articulation_body_control_rl_assisted:
  force: 0.0
  speed: 0.0
  cooldown: 0.0
  key:
    keyboard: {}
    mouse: {}
  action_space:
    type: "box"
    dtype: "float32"
    shape: "auto"
    range: [-1.0, 1.0]
    description: "Policy command vector resolved at runtime from policy bundle; low-level actions use mjlab_components.act."

Tool_attachment:
  force: 0.0
  speed: 0.0
  cooldown: 0.0
  proximity_threshold: 0.75
  proximity_height_threshold: 3.5
  key:
    keyboard:
      attach: [u]
    mouse: {}
  # 附著工具的行為（如炮塔瞄準）由各 object_template/*/functions/ 的 action 提供；
  # RL 維度在關卡初始化時依 tool_configs 中最大 tool rl_action.shape 動態解析。
  # TODO attach 僅 Human U 鍵，不佔 RL action 維度。
  action_space:
    type: "box"
    dtype: "float32"
    shape: 0
    range: [-1.0, 1.0]
    description: "RL control for attached tools."

