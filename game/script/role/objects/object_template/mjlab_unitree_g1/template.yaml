id: mjlab_unitere_g1
display_name: Unitree G1
control_config_path: control_configs.yaml
object_type: usd
# 物件屬性：可透過 "Add Object Template" 批量套用到 player_configs
possess_offset:
  - 0.0
  - 0.0
  - 0.0
abilities:
  - Articulation_body_control_rl_assisted
object:
  pattern: unitree_g1
  type: usd
  object_friction: 0.6
  object_elasticity: 0.5
  file_name: usd/g1_29dof_with_hand_rev_1_0.usd
  file_path_or_source: Action_Game_RL_Assets/assets/external_sources/newton-assets-main/unitree_g1/
  floating: null
  base_joint: null
  parent_body: -1
  only_load_enabled_rigid_bodies: false
  only_load_enabled_joints: true
  joint_drive_gains_scaling: 1
  verbose: false
  ignore_paths: null
  collapse_fixed_joints: false
  enable_self_collisions: false
  apply_up_axis_from_stage: false
  root_path: /
  joint_ordering: dfs
  bodies_follow_joint_ordering: true
  skip_mesh_approximation: false
  load_authored_normals: false
  load_sites: true
  load_visual_shapes: true
  hide_collision_shapes: true
  force_show_colliders: false
  parse_mujoco_options: true
  mesh_maxhullvert: null
  schema_resolvers: null
  force_position_velocity_actuation: false
  override_root_xform: false
  use_mujoco_policy_init: true
  control_task: velocity_locomotion
  control_policy_version: V1
  # ---------------------------------------------------------------------------
  # mjlab-aligned primitive collision geometry.
  #
  # The USD G1 carries ~38 convex-hull colliders. Under self-collision those
  # enter mujoco_warp's CCD/EPA path (MESH geoms), whose per-slot scratch
  # buffers scale as nconmax*nworld (~5.5KB/slot), making 4096-env training on
  # a 16GB GPU impossible and flooding the broadphase with candidate pairs.
  #
  # mjlab avoids this by giving the G1 ~26 capsule/sphere colliders (see
  # tests/mjlab/src/mjlab/asset_zoo/robots/unitree_g1/xmls/g1.xml): all
  # primitive -> cheap primitive narrowphase, no CCD scratch, low pair counts.
  # The values below mirror that model: convex-hull bodies are replaced with
  # the matching mjlab capsule/sphere, and limbs mjlab never collides
  # (hip_pitch / ankle_pitch / wrist_roll / fingers / logo) are disabled so
  # they never enter broadphase at all. Feet use mjlab's 7 capsules per ankle.
  body_collision_shape_overrides:
    left_hip_roll_link:
      type: capsule
      radius: 0.06
      fromto: [[0.02, 0.0, 0.0], [0.02, 0.0, -0.08]]
    right_hip_roll_link:
      type: capsule
      radius: 0.06
      fromto: [[0.02, 0.0, 0.0], [0.02, 0.0, -0.08]]
    left_hip_yaw_link:
      type: capsule
      radius: 0.055
      fromto: [[0.0, 0.0, -0.03], [-0.06, 0.0, -0.17]]
    right_hip_yaw_link:
      type: capsule
      radius: 0.055
      fromto: [[0.0, 0.0, -0.03], [-0.06, 0.0, -0.17]]
    left_knee_link:
      type: capsule
      radius: 0.045
      fromto: [[0.01, 0.0, 0.0], [0.01, 0.0, -0.15]]
      also_add:
        - type: capsule
          radius: 0.03
          fromto: [[0.01, 0.0, -0.2], [0.01, 0.0, -0.28]]
    right_knee_link:
      type: capsule
      radius: 0.045
      fromto: [[0.01, 0.0, 0.0], [0.01, 0.0, -0.15]]
      also_add:
        - type: capsule
          radius: 0.03
          fromto: [[0.01, 0.0, -0.2], [0.01, 0.0, -0.28]]
    torso_link:
      type: capsule
      radius: 0.09
      fromto: [[0.01, 0.0, 0.08], [0.01, 0.0, 0.2]]
      # mjlab ``head_collision`` lives on torso_link (g1.xml pos="0 0 0.43"),
      # not on the USD dummy ``head_link`` body whose origin coincides with
      # the pelvis (that mis-placement produced a standing ~3500 N overlap).
      also_add:
        - type: sphere
          radius: 0.06
          pos: [0.0, 0.0, 0.43]
    # USD promotes the visual ``head_link`` mesh to a body at the pelvis origin.
    # Disable it; the real head sphere is ``also_add`` on torso_link above.
    head_link: disable
    left_shoulder_yaw_link:
      type: capsule
      radius: 0.035
      fromto: [[0.0, 0.0, -0.08], [0.0, 0.0, 0.05]]
    right_shoulder_yaw_link:
      type: capsule
      radius: 0.035
      fromto: [[0.0, 0.0, -0.08], [0.0, 0.0, 0.05]]
    left_elbow_link:
      type: capsule
      radius: 0.035
      fromto: [[-0.01, 0.0, -0.01], [0.08, 0.0, -0.01]]
    right_elbow_link:
      type: capsule
      radius: 0.035
      fromto: [[-0.01, 0.0, -0.01], [0.08, 0.0, -0.01]]
    left_wrist_pitch_link:
      type: capsule
      radius: 0.035
      fromto: [[-0.01, 0.0, 0.0], [0.06, 0.0, 0.0]]
    right_wrist_pitch_link:
      type: capsule
      radius: 0.035
      fromto: [[-0.01, 0.0, 0.0], [0.06, 0.0, 0.0]]
    left_wrist_yaw_link:
      type: capsule
      radius: 0.035
      fromto: [[0.07, 0.0, 0.0], [0.15, -0.02, 0.0]]
    right_wrist_yaw_link:
      type: capsule
      radius: 0.035
      fromto: [[0.07, 0.0, 0.0], [0.15, 0.02, 0.0]]
    # Limbs mjlab never self-collides -> drop their colliders entirely.
    pelvis_contour_link: disable
    # mjlab keeps a ``pelvis_collision`` sphere (r=0.07 @ [0,0,-0.08] in the
    # pelvis frame, g1.xml). The USD pelvis only carries visual meshes, so add
    # the sphere as a brand-new massless collider; the contour hull stays
    # disabled. This is what makes the pelvis<->hip_roll excludes (below)
    # actually filter something, matching mjlab's contact model.
    pelvis:
      add: true
      type: sphere
      radius: 0.07
      pos: [0.0, 0.0, -0.08]
    left_hip_pitch_link: disable
    right_hip_pitch_link: disable
    left_ankle_pitch_link: disable
    right_ankle_pitch_link: disable
    # mjlab 7 foot capsules (class foot_capsule, r=0.01) on ankle_roll; drop
    # the USD 4-sphere / convex leftovers so standing self-collision stays 0.
    left_ankle_roll_link:
      - type: disable
      - add: true
        type: capsule
        radius: 0.01
        fromto: [[0.1, -0.026, -0.025], [0.05, -0.027, -0.025]]
      - add: true
        type: capsule
        radius: 0.01
        fromto: [[-0.044, -0.018, -0.025], [0.123, -0.018, -0.025]]
      - add: true
        type: capsule
        radius: 0.01
        fromto: [[-0.052, -0.01, -0.025], [0.13, -0.01, -0.025]]
      - add: true
        type: capsule
        radius: 0.01
        fromto: [[-0.054, 0.0, -0.025], [0.132, 0.0, -0.025]]
      - add: true
        type: capsule
        radius: 0.01
        fromto: [[-0.052, 0.01, -0.025], [0.13, 0.01, -0.025]]
      - add: true
        type: capsule
        radius: 0.01
        fromto: [[-0.044, 0.018, -0.025], [0.123, 0.018, -0.025]]
      - add: true
        type: capsule
        radius: 0.01
        fromto: [[0.1, 0.026, -0.025], [0.05, 0.026, -0.025]]
    right_ankle_roll_link:
      - type: disable
      - add: true
        type: capsule
        radius: 0.01
        fromto: [[0.1, -0.026, -0.025], [0.05, -0.026, -0.025]]
      - add: true
        type: capsule
        radius: 0.01
        fromto: [[-0.044, -0.018, -0.025], [0.123, -0.018, -0.025]]
      - add: true
        type: capsule
        radius: 0.01
        fromto: [[-0.052, -0.01, -0.025], [0.13, -0.01, -0.025]]
      - add: true
        type: capsule
        radius: 0.01
        fromto: [[-0.054, 0.0, -0.025], [0.132, 0.0, -0.025]]
      - add: true
        type: capsule
        radius: 0.01
        fromto: [[-0.052, 0.01, -0.025], [0.13, 0.01, -0.025]]
      - add: true
        type: capsule
        radius: 0.01
        fromto: [[-0.044, 0.018, -0.025], [0.123, 0.018, -0.025]]
      - add: true
        type: capsule
        radius: 0.01
        fromto: [[0.1, 0.026, -0.025], [0.05, 0.026, -0.025]]
    left_wrist_roll_link: disable
    right_wrist_roll_link: disable
    left_hand_palm_link: disable
    right_hand_palm_link: disable
    left_hand_thumb_0_link: disable
    left_hand_thumb_1_link: disable
    left_hand_thumb_2_link: disable
    right_hand_thumb_0_link: disable
    right_hand_thumb_1_link: disable
    right_hand_thumb_2_link: disable
    left_hand_index_0_link: disable
    left_hand_index_1_link: disable
    right_hand_index_0_link: disable
    right_hand_index_1_link: disable
    left_hand_middle_0_link: disable
    left_hand_middle_1_link: disable
    right_hand_middle_0_link: disable
    right_hand_middle_1_link: disable
    logo_link: disable
    # mjlab keeps no collider on the shoulder_pitch motor housings; dropping the
    # leftover convex hulls avoids constant shoulder_pitch<->shoulder_yaw force.
    left_shoulder_pitch_link: disable
    right_shoulder_pitch_link: disable
  # Pairs whose colliders overlap at nominal joint positions but must never
  # collide (mirrors mjlab g1.xml <contact> excludes). Removes the phantom
  # ~1200N elbow<->wrist overlap forces at the standing pose.
  body_collision_exclude_pairs:
    - [left_elbow_link, left_wrist_pitch_link]
    - [right_elbow_link, right_wrist_pitch_link]
    - [pelvis, left_hip_roll_link]
    - [pelvis, right_hip_roll_link]
