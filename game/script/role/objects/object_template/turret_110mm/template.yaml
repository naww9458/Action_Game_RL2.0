id: turret_110mm
display_name: 110mm Turret
mount_anchor_name: turret_base_anchor
host_anchor_name: hull_mount_anchor
host_body_prim_suffix: vehicle_body
tool_base_body_prim_suffix: turret_body
# 掛載介面（物件屬性）：可透過 "Add Object Template" 批量套用到 tool_configs
mount_joint_type: revolute
mount_joint_axis:
  - 0.0
  - 0.0
  - 1.0
mount_joint_limits:
  - -3.14159
  - 3.14159
internal_joint_names:
  - RevoluteJoint
possess_offset:
  - 0.0
  - 0.0
  - 0.0
abilities:
  - Shoot
  - Articulation_body_control
control_config_path: control_configs.yaml

# 掛載後的行為（action）。aim = 讓炮管對準第三人稱相機方向。
# 此欄位讓 tool_function_registry 在環境真的用到 turret_110mm 時，
# 才延遲加載 turret_110mm/functions/aim.py 的 aim action。
action: aim
# 以下是 aim action 的專屬配置（由 Turret110mmAimAction 讀取）
aim:
  # 俯仰關節名（炮管必須是該 RevoluteJoint 的子體，不能用 turret_body）
  pitch_joint_name: RevoluteJoint
  # 瞄準剛體（炮管）/ Body used for aim direction
  aim_body_prim_suffix: gun_110
  # Y 軸 RevoluteJoint：+q 為俯角，與相機 pitch_error 符號相反。
  # 所有調參數值一律以本檔為唯一來源（代碼中的類默認值僅為中性安全值）；
  # 單一關卡可用 level tool_configs 的舊平鋪鍵 aim_control 覆寫。
  control:
    # yaw（掛載 revolute 關節）PD 驅動
    yaw_torque_gain: 200.0
    yaw_damping: 20.0
    max_yaw_torque: 500.0
    # pitch（俯仰關節）PD 驅動
    pitch_joint_sign: -1.0
    pitch_torque_gain: 80000.0
    pitch_damping: 80000.0
    max_pitch_torque: 40000.0
    angle_dead_zone_deg: 0.5
    # weld 降級模式下的 yaw 角速度增益
    weld_yaw_drive_gain: 8.0
    # 瞄準方向約定（炮管局部前向 / 世界 Z 上）
    aim_forward_local: [1.0, 0.0, 0.0]
    world_up: [0.0, 0.0, 1.0]
    # 物理模型未報告關節限位時使用的俯仰角限位（度）
    pitch_limit_fallback_deg: [-10.0, 10.0]
    # 動態重力補償：由輸出扭矩與俯仰角變化線上估測 coeff（τ_g = coeff * cos(q)）
    pitch_gravity_comp_enable: false
    pitch_gravity_learn_rate: 0.08
    pitch_gravity_basis: cos
    pitch_gravity_rate_eps: 0.2
    pitch_gravity_accel_eps: 2.0
    pitch_gravity_dq_eps: 0.002
  # RL / object_inspector 連續控制（掛載後由 Tool_attachment 消費；attach 僅 Human U 鍵）
  rl_action:
    shape: 3
    range: [-1.0, 1.0]
    description: "Turret yaw, barrel pitch, and fire while attached."
    dims:
      - name: turret_yaw
      - name: barrel_pitch
      - name: fire
    # action=±1 映射為瞄準誤差（弧度），再經既有 PD 驅動關節
    yaw_command_scale_rad: 1.57079632679
    pitch_command_scale_rad: 0.17453292519
    fire_threshold: 0.0
  # turret_110mm 專屬第三人稱人類瞄準視角（掛載後在 CustomViewerGL 顯示）
  view:
    circle_radius_px: 14.0
    circle_segments: 24
    circle_color: [255, 0, 0, 220]
    limit_line_color: [255, 0, 0, 200]
    limit_line_half_width_px: 90.0
    line_width: 2.0
object_type: usd
object:
  pattern: turret_110mm
  type: usd
  object_friction: 0.5
  object_elasticity: 0.5
  file_name: turret_110mm.usdc
  file_path_or_source: ./Action_Game_RL_Assets/assets/
  floating: true
  base_joint: null
  parent_body: -1
  only_load_enabled_rigid_bodies: false
  only_load_enabled_joints: true
  joint_drive_gains_scaling: 1
  verbose: false
  ignore_paths:
    - /root/GroundPlane
  collapse_fixed_joints: false
  enable_self_collisions: false
  apply_up_axis_from_stage: false
  root_path: /
  joint_ordering: dfs
  bodies_follow_joint_ordering: true
  skip_mesh_approximation: true
  load_authored_normals: true
  load_sites: true
  load_visual_shapes: true
  hide_collision_shapes: false
  force_show_colliders: false
  parse_mujoco_options: true
  mesh_maxhullvert: null
  schema_resolvers: null
  force_position_velocity_actuation: true
  override_root_xform: false
  use_mujoco_policy_init: true
  control_task: turret_aim
  control_policy_version: null
