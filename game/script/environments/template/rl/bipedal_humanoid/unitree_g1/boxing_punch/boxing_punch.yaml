display_name: 揮拳訓練
intro: 訓練 Unitree G1 機器人進行拳擊中的揮拳動作
environment_class: script.environments.custom.rl.bipedal_humanoid.unitree_g1.boxing_punch.boxing_punch.BoxingPunch
environment_configs:
  space_xyz:
  - 3.0
  - 3.0
  - 3.0
  interval_distance: 5.0
  # Fixed 70/30 world split: floor((w+1)*ratio) > floor(w*ratio) marks a world
  # as pure walk (no target bound, random commands, walk rewards only).
  walk_env_ratio: 0.3
  # Pure-walk worlds spawn the striking target this much higher (m) so the
  # kinematic anchor + soft spring holds it far above the robot.
  walk_target_z_raise: 3.0
  gravity:
  - 0
  - 0
  - -9.81
  damping:
  - 0.1
  - 0.1
  fps_action: 50
  sub_steps: 4
  ground_shape_friction: 0.6
  solver_config:
    type: mujoco
    separate_worlds: null
    njmax: '2048'
    nconmax: '1024'
    iterations: '10'
    ls_iterations: '20'
    ccd_iterations: '50'
    sdf_iterations: null
    sdf_initpoints: null
    solver: newton
    integrator: implicitfast
    cone: pyramidal
    jacobian: null
    impratio: null
    tolerance: null
    ls_tolerance: null
    ccd_tolerance: null
    density: null
    viscosity: null
    wind: null
    magnetic: null
    use_mujoco_cpu: false
    enable_multiccd: false
    disable_contacts: false
    update_data_interval: 1
    save_to_mjcf: null
    use_mujoco_contacts: true
    include_sites: true
    skip_visual_only_geoms: true
  observation_noise:
    base_lin_vel: 0.5
    base_ang_vel: 0.2
    projected_gravity: 0.05
    joint_pos: 0.01
    joint_vel: 1.5
  domain_randomization:
    push_robot:
      enabled: true
      interval_range_s:
      - 1.0
      - 3.0
      velocity_range:
        x:
        - -0.5
        - 0.5
        y:
        - -0.5
        - 0.5
        z:
        - -0.4
        - 0.4
        roll:
        - -0.52
        - 0.52
        pitch:
        - -0.52
        - 0.52
        yaw:
        - -0.78
        - 0.78
    encoder_bias:
      enabled: true
      bias_range:
      - -0.015
      - 0.015
    foot_friction:
      enabled: true
      range:
      - 0.3
      - 1.2
      shared_random: true
      body_patterns:
      - left_ankle_roll_link
      - right_ankle_roll_link
    base_com:
      enabled: true
      offset_range:
        x:
        - -0.025
        - 0.025
        y:
        - -0.025
        - 0.025
        z:
        - -0.03
        - 0.03
entity_configs:
  new_entity_0:
    type: entity
    id: ''
    name: New_Entity
    color:
    - 200
    - 200
    - 200
    default_position:
    - - 1.0
      - 2.0
    - - -1.0
      - 1.0
    - - 1.4
      - 1.4
    default_rotation:
    - 0.0
    - 0.0
    default_velocity:
    - 0.0
    - 0.0
    - 0.0
    default_angular_velocity:
    - 0.0
    - 0.0
    - 0.0
    possess_offset:
    - 0.0
    - 0.0
    - 0.0
    abilities: []
    object:
      pattern: striking_target
      type: rigid_soft_anchor
      object_friction: 0.5
      object_elasticity: 0.2
      target_offset:
      - 0.0
      - 0.0
      - -0.22
      max_linear_force: 20.0
      linear_stiffness: 600.0
      linear_damping: 40.0
      anchor:
        shape: box
        size:
        - 0.025
        - 0.025
        - 0.025
        radius: 0.025
        filter_all_collisions: true
        object_friction: 0.5
        object_elasticity: 0.0
        color:
        - 255
        - 196
        - 37
        object_mass: 1.0
        lock_inertia: true
      target:
        shape: sphere
        size:
        - 0.12
        - 0.12
        - 0.12
        radius: 0.12
        filter_all_collisions: false
        object_friction: 0.8
        object_elasticity: 0.35
        object_mass: 0.8
        lock_inertia: false
        color:
        - 217
        - 38
        - 31
    separation:
    - 1
    - 1
    - 1
player_configs:
- type: player
  id: player_0
  name: Player_1
  color:
  - 200
  - 200
  - 200
  default_position:
  - 0.0
  - 0.0
  - 0.76
  default_rotation:
  - 0.0
  - 0.0
  default_velocity:
  - 0.0
  - 0.0
  - 0.0
  default_angular_velocity:
  - 0.0
  - 0.0
  - 0.0
  possess_offset:
  - 0.0
  - 0.0
  - 0.0
  abilities:
    Articulation_body_control: {}
  object:
    pattern: unitree_g1
    type: usd
    object_friction: 0.6
    object_elasticity: 0.5
    file_name: usd/g1_29dof_with_hand_rev_1_0.usd
    file_path_or_source: Action_Game_RL_Assets/assets/external_sources/newton-assets-main/unitree_g1/
    floating: null
    base_joint: null
    parent_body: -1
    only_load_enabled_rigid_bodies: false
    only_load_enabled_joints: true
    joint_drive_gains_scaling: 1
    verbose: false
    ignore_paths: null
    collapse_fixed_joints: false
    enable_self_collisions: false
    apply_up_axis_from_stage: false
    root_path: /
    joint_ordering: dfs
    bodies_follow_joint_ordering: true
    skip_mesh_approximation: false
    load_authored_normals: false
    load_sites: true
    load_visual_shapes: true
    hide_collision_shapes: true
    force_show_colliders: false
    parse_mujoco_options: true
    mesh_maxhullvert: null
    schema_resolvers: null
    force_position_velocity_actuation: false
    override_root_xform: false
    use_mujoco_policy_init: true
    control_task: velocity_locomotion
    control_policy_version: boxing_v1
  controller: RL
  team_id: 1
  health: 5.0
